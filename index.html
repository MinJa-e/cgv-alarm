<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGV 용산 IMAX 알리미</title>
  <link rel="manifest" href="./manifest.json">
</head>

<body style="text-align:center; padding: 40px 20px; font-family: sans-serif; background-color: #f9f9f9;">
  <h1 style="color: #e50914;">🎬 용산 IMAX 알리미</h1>
  <p>아이폰/안드로이드 홈 화면에 추가 후 이용해 주세요.</p>

  <button id="sub-btn"
    style="padding: 15px 30px; font-size: 18px; cursor: pointer; background: #e50914; color: #fff; border: none; border-radius: 8px; font-weight: bold; margin-top: 20px;">
    🔔 IMAX 알림 신청하기
  </button>

  <div id="token-box"
    style="margin-top: 30px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px; word-break: break-all; font-size: 14px; text-align: left;">
    알림 신청 버튼을 누르면 여기에 토큰이 생성됩니다.
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    // 🔴 [수정 필요] 아까 Firebase에서 확인한 firebaseConfig 객체를 그대로 넣으세요.
    const firebaseConfig = {
      apiKey: "AIzaSyC57js6l9dVqgxdN1D5gri9kJa-cOzawAA",
      authDomain: "cgv-alarm-ddc5c.firebaseapp.com",
      projectId: "cgv-alarm-ddc5c",
      storageBucket: "cgv-alarm-ddc5c.firebasestorage.app",
      messagingSenderId: "1016931664",
      appId: "1:1016931664:web:75864aa32de8f949cd7855"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    document.getElementById('sub-btn').addEventListener('click', async () => {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          // 서비스 워커 등록
          await navigator.serviceWorker.register('./sw.js');

          // 서비스 워커가 실제로 활성화될 때까지 대기 
          const registration = await navigator.serviceWorker.ready;

          // 푸시 토큰 생성
          const token = await getToken(messaging, {
              vapidKey: 'BATUVtjMOFvitJh_KgWCFLqvEpUVAXxoHK5M5RjqBu3oJJ4Jo8Rm16HneTOAA3aVEtjsin-rHdcrRS4RRXvtT52s',
              serviceWorkerRegistration: registration
          });

          document.getElementById('token-box').innerHTML =
            `<b>✅ 알림 등록 성공! 아래 토큰을 카톡 등으로 보내주세요:</b><br><br><code>${token}</code>`;
        } else {
          alert('알림 권한이 거부되었습니다. 설정에서 알림을 허용해주세요.');
        }
      } catch (err) {
        alert('오류 발생: ' + err.message);
      }
    });
  </script>
</body>

</html>
